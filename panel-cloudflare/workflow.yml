name: Publicar contenido de Sinteria
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: sinteria-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false && vars.SINTERIA_PANEL_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si hay contenido nuevo
        id: revision
        env:
          SINTERIA_PANEL_URL: ${{ vars.SINTERIA_PANEL_URL }}
          SINTERIA_FORCE_BUILD: ${{ github.event_name != 'schedule' }}
        run: python3 panel-cloudflare/check_revision.py
      - uses: actions/setup-python@v5
        if: steps.revision.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Preparar herramientas de publicación
        if: steps.revision.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check lxml==5.4.0 Pillow==11.3.0
      - name: Generar páginas estáticas desde el contenido publicado
        if: steps.revision.outputs.changed == 'true'
        env:
          SINTERIA_PANEL_URL: ${{ vars.SINTERIA_PANEL_URL }}
        run: python panel-cloudflare/publish.py --panel-url "$SINTERIA_PANEL_URL"
      - uses: actions/configure-pages@v5
        if: steps.revision.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        if: steps.revision.outputs.changed == 'true'
        with:
          path: public-panel-build
          retention-days: 1
      - name: Publicar la web
        id: deployment
        if: steps.revision.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Retirar el archivo temporal de esta publicación
        if: always() && steps.artifact.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
